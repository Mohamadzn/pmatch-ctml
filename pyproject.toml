[project]
name = "pmatch-ctml"
version = "0.1.0"
description = "Clinical trial protocol PDF to CTML, with Azure Document Intelligence and Microsoft Agent Framework agents"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["runs", "pdfs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # protocol text uses Unicode signs such as ≥ and ’

[tool.pytest.ini_options]
testpaths = ["app/tests", "evaluation/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
